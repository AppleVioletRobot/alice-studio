<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe5">
  <title>Shit Krita</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <header class="topbar">
    <h1 id="studio-title">Shit Krita</h1>
    <div class="top-actions">
      <select id="palette-select" class="action-select" aria-label="Colours" title="Colours">
        <option value="" disabled selected>Colours</option>
      </select>
      <button id="save" class="save" type="button">Save</button>
      <button id="undo" type="button">Undo</button>
      <button id="clear" type="button">Clear</button>
    </div>
  </header>
  <main class="studio">
    <aside class="tools" aria-label="Drawing tools">
      <div class="tool-group">
        <button class="tool active" data-tool="pencil" type="button" aria-label="Pencil">✎</button>
        <button class="tool" data-tool="eraser" type="button" aria-label="Eraser">▱</button>
        <button class="tool" data-tool="fill" type="button" aria-label="Fill bucket">▰</button>
      </div>
      <div id="widths" class="widths" aria-label="Pencil width"></div>
      <div class="textures" aria-label="Texture">
        <button class="texture active" data-texture="solid" type="button">INK</button>
        <button class="texture" data-texture="dots" type="button">DOTS</button>
      </div>
      <div id="palette" class="palette" aria-label="Colours"></div>
    </aside>
    <section class="canvas-wrap" id="canvas-wrap">
      <canvas id="canvas" aria-label="Drawing canvas"></canvas>
    </section>
  </main>
  <script src="studio.js?v=4"></script>
</body>
</html>
